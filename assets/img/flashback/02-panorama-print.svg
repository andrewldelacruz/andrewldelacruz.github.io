<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900"
     role="img" aria-label="Placeholder: FlashBack — printed panorama">
  <style>
    .bg { fill: #eceae4; }
    .fr { fill: none; stroke: #c9c5b9; stroke-width: 5; stroke-dasharray: 40 27; }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .l { font-size: 50px; font-weight: 650; fill: #6b665a; letter-spacing: -0.01em; }
    .s { font-size: 31px; fill: #8d887a; }
    .t { font-size: 25px; font-weight: 600; fill: #b0aa9a; letter-spacing: 0.14em; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #201f19; } .fr { stroke: #3b392f; }
      .l { fill: #8e8878; } .s { fill: #6e6a5d; } .t { fill: #4e4b40; }
    }
  </style>
  <rect class="bg" width="1200" height="900"/>
  <rect class="fr" x="32" y="32"
        width="1137" height="837" rx="22"/>
  <text x="600" y="353" class="l">FlashBack — printed panorama</text>
    <text x="600" y="428" class="s">A printed panorama in hand or coming off the printer. Show the physical</text>
    <text x="600" y="473" class="s">keepsake.</text>
  <text x="600" y="832" class="t">PHOTO NEEDED</text>
</svg>
