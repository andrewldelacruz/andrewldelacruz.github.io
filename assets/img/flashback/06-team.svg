<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     role="img" aria-label="Placeholder: FlashBack — the team">
  <style>
    .bg { fill: #eceae4; }
    .fr { fill: none; stroke: #c9c5b9; stroke-width: 5; stroke-dasharray: 40 27; }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .l { font-size: 50px; font-weight: 650; fill: #6b665a; letter-spacing: -0.01em; }
    .s { font-size: 31px; fill: #8d887a; }
    .t { font-size: 25px; font-weight: 600; fill: #b0aa9a; letter-spacing: 0.14em; }
