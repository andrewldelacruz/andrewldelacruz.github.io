<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440" width="440" height="440"
     role="img" aria-label="Placeholder: Headshot">
  <style>
    .bg { fill: #eceae4; }
    .fr { fill: none; stroke: #c9c5b9; stroke-width: 3; stroke-dasharray: 20 13; }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .l { font-size: 24px; font-weight: 650; fill: #6b665a; letter-spacing: -0.01em; }
    .s { font-size: 15px; fill: #8d887a; }
    .t { font-size: 12px; font-weight: 600; fill: #b0aa9a; letter-spacing: 0.14em; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #201f19; } .fr { stroke: #3b392f; }
      .l { fill: #8e8878; } .s { fill: #6e6a5d; } .t { fill: #4e4b40; }
    }
  </style>
  <rect class="bg" width="440" height="440"/>
  <rect class="fr" x="15" y="15"
        width="409" height="409" rx="11"/>
  <text x="220" y="173" class="l">Headshot</text>
    <text x="220" y="209" class="s">Head-and-shoulders photo, neutral background. Reuse your</text>
    <text x="220" y="231" class="s">LinkedIn profile picture.</text>
  <text x="220" y="407" class="t">PHOTO NEEDED</text>
</svg>
